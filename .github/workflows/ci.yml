name: weather99 tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q weather99
      - run: python -m pip install ruff
      - run: ruff check weather99/hourly_nowcast.py tests/test_hourly_shadow.py tests/test_shadow_integration.py --select E4,E7,E9,F
      - run: python -m unittest discover -s tests -v
